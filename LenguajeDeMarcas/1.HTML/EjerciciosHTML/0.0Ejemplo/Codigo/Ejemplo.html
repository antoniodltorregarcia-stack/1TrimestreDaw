<html lang="es">
    <head>
        <meta charset="UTF-8"> <!--Obligao, siempre trabajamos con este-->
        <meta name="author" content="Tony"> <!--creamos un meta tipo nombre y ponemos nuestro nombre-->
        <meta name="description" content="Este es el primer ejemplo de html"> <!--creamos un meta tipo descripcion y explicamos que vamos a hacer-->
        <title>Ejemplo Inicial HTML</title>
        <link rel="icon" href="../fotitos/arbolDeLaVida.jpg"/> <!--Creamos un favicon para nuestra página-->
    </head>
    <body>
        <h1>Ejemplo Inicial, esto es un (h1)</h1>

        <h2>Empezando con html, esto es un (h2)</h2>

        <p><em>Por fin</em> estamos dando <strong>HTML</strong>, oleeee (esto es un p)

            , esto va a estar seguido porque es el mismo parrafo
        </p>

        <p>Ahora si, este es otro <strong><ins>parrafo</ins></strong></p>

        <!--<strong> = negrita , <em> = cursiva , <ins> = subrayada-->

        
    </body>
</html>
