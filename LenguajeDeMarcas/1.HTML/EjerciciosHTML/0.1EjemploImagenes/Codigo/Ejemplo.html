<html lang="es">
    <head>
        <meta charset="UTF-8"> <!--Obligao, siempre trabajamos con este-->
        <meta name="author" content="Tony"> <!--creamos un meta tipo nombre y ponemos nuestro nombre-->
        <meta name="description" content="Este es el primer ejemplo de html"> <!--creamos un meta tipo descripcion y explicamos que vamos a hacer-->
        <title>Ejemplo Inicial HTML</title>
        <link rel="icon" href="../fotitos/focacondefinitivo.jpg"/> <!--Creamos un favicon para nuestra página-->
    </head>
    <body>
        <h1>Ejemplo sobre imagenes</h1>

        <p>Aqui vemos como trabajamos con imagenes</p>

        <img 
            title="Casa hobbit" 
            alt="Esto es una casa Hobbit"
            src="../fotitos/casaHobbit.avif"
            width="500px"
        />

        <!--width y height para tamaño, se puede usar con porcentaje o con px-->
        
        <img 
            title="confetito" 
            alt="confetii"
            src="../fotitos/confeti.gif"
            width="30%"
        />

        <img 
            title="Tremenda foca" 
            alt="Esto es una casa Hobbit"
            src="../fotitos/focacondefinitivo.jpg"
            width="500px"
        />

        
    </body>
</html>
